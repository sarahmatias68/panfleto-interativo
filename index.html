<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#264d25">
  <title>Vila Gastronômica · Natal do Bem</title>
  <meta name="description" content="Vila Gastronômica do Natal do Bem: veja os quiosques, especialidades, pratos sociais e cardápios.">
  <link rel="icon" href="assets/ramo.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="assets/logo-natal.svg" as="image" fetchpriority="high">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&family=Poppins:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/estilo.css">

  <script src="js/dados.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <!-- Ícone de filtro, reutilizado nos botões da barra -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="icone-filtro" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M3 6h14M3 14h14"/>
      <circle cx="7" cy="6" r="2.2" fill="currentColor"/>
      <circle cx="13" cy="14" r="2.2" fill="currentColor"/>
    </symbol>
  </svg>

  <div class="topo"></div>
  <div class="borda" aria-hidden="true"></div>

  <header class="cabecalho">
    <img class="ramo" src="assets/ramo.svg" alt="" width="49" height="42">
    <img class="logo" src="assets/logo-natal.svg" alt="Natal do Bem" width="101" height="58" fetchpriority="high">
    <img class="ramo ramo-direito" src="assets/ramo.svg" alt="" width="49" height="42">
  </header>
  <div class="faixa"><h1>Vila Gastronômica</h1></div>

  <main class="painel" aria-label="Quiosques da Vila Gastronômica">
    <aside class="lateral">
      <h2 class="lateral-titulo">Filtros</h2>

      <div class="barra">
        <button id="botao-filtros" class="botao-barra botao-filtros" type="button" aria-expanded="false" aria-controls="gaveta">
          <svg class="icone" aria-hidden="true"><use href="#icone-filtro"/></svg>
          Quiosques <span id="contador" class="contador" hidden></span>
        </button>
        <button id="chave" class="botao-barra chave" type="button" role="switch" aria-checked="false">
          <span class="trilho" aria-hidden="true"><i></i></span>
          <svg class="icone" aria-hidden="true"><use href="#icone-filtro"/></svg>
          Prato social
        </button>
      </div>
      <p class="lateral-ajuda">Mostra o prato social de cada quiosque, com o preço. Você pode combinar com as especialidades.</p>

      <div id="ativos" class="ativos" hidden></div>

      <div id="gaveta" class="gaveta" role="group" aria-labelledby="gaveta-titulo">
        <div class="gaveta-cab">
          <h2 id="gaveta-titulo">Quiosques</h2>
          <button id="gaveta-fechar" class="gaveta-fechar" type="button" aria-label="Fechar">×</button>
        </div>
        <div id="opcoes" class="opcoes"></div>
        <div class="gaveta-pe">
          <button id="gaveta-limpar" class="limpar" type="button" hidden>Limpar</button>
          <button id="gaveta-ok" class="gaveta-ok" type="button">Ver quiosques</button>
        </div>
      </div>
    </aside>

    <div class="conteudo">
      <p id="resumo" class="resumo" role="status" aria-live="polite"></p>
      <div id="mapa" class="mapa"></div>
      <div id="lista" class="lista" hidden></div>
    </div>
  </main>

  <dialog id="folha" class="folha" aria-labelledby="folha-nome">
    <div class="folha-conteudo">
      <img id="folha-icone" alt="" width="68" height="68">
      <h2 id="folha-nome" class="folha-nome"></h2>
      <span id="folha-tipo" class="folha-tipo"></span>
      <p id="folha-prato" class="folha-prato"></p>
      <a id="folha-cardapio" class="folha-cardapio" target="_blank" rel="noopener">Ver cardápio</a>
      <form method="dialog">
        <button class="folha-fechar" type="submit">Fechar</button>
      </form>
    </div>
  </dialog>
</body>
</html>
